  <!-- ---- close 1 · the recap ----
       Deliberately the same five-tile component as §0's reasons, and
       deliberately in the same order the deck taught them. Every tile
       is a [data-goto] jump, so this doubles as the board to stand on
       during questions: someone asks about the cliff, you press 04 and
       you are on the cliff. -->
  <section class="slide" data-section="7">
    <div class="slide-inner">
      <div class="eyebrow">Take this home</div>
      <h2>If you remember five things</h2>

      <div class="tiles">
        <button type="button" class="tile jump" data-goto="0">
          <span class="idx">01</span>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/>
          </svg>
          <span class="k">It is a file</span>
          <span class="v">Weights on your disk, an app that reads them. There is no third thing.</span>
        </button>
        <button type="button" class="tile jump" data-goto="4">
          <span class="idx">02</span>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="7" width="17" height="10" rx="1.5"/>
            <path d="M7 7v10M11 7v10M15 7v10"/>
          </svg>
          <span class="k">Fit comes first</span>
          <span class="v">Weights + KV cache + a couple of spare GB. Over that, it crawls.</span>
        </button>
        <button type="button" class="tile jump" data-goto="3">
          <span class="idx">03</span>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 15h16"/><circle cx="9" cy="9" r="1.4"/><circle cx="15" cy="21" r="1.4"/>
          </svg>
          <span class="k">Speed is division</span>
          <span class="v">tok/s &asymp; bandwidth &divide; model size. Everything else is detail.</span>
        </button>
        <button type="button" class="tile jump" data-goto="4">
          <span class="idx">04</span>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 6.5h6v13h-6z"/><path d="M13 11h7.5"/><path d="M13 16h7.5"/>
          </svg>
          <span class="k">The 4-bit floor</span>
          <span class="v">A bigger model at 4-bit beats a smaller one at 8. Below 4 it falls apart.</span>
        </button>
        <button type="button" class="tile jump" data-goto="6">
          <span class="idx">05</span>
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5h9l2 2h5v11H4z"/><path d="M9.5 13.5h5"/><path d="M12 11v5"/>
          </svg>
          <span class="k">Bring the knowledge</span>
          <span class="v">Hand it the document. Do not ask it what it remembers.</span>
        </button>
      </div>

      <p class="note" style="margin-top:1.4rem">Any of the five will take you back to the
        section it came from &mdash; and the index along the bottom edge goes anywhere.</p>
    </div>
  </section>
