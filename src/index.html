<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI, Unplugged</title>
<style>
<!--#include css/*.css -->
</style>
</head>
<body>

<!-- Every logo is inlined. Nothing is fetched at runtime — the offline
     rule applies to brand assets too. Numeric prefixes exist so the glob
     order is stable, not because the order matters for <symbol>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!--#include assets/logos/*.svg -->
</defs></svg>

<div class="substrate"></div>
<div class="vignette"></div>

<div class="deck" id="deck">

<!--#include slides/*.html -->
</div>

<!-- filled by deck.js; empty rather than a stale literal that would
     be wrong the moment a slide is added -->
<div class="counter" id="counter"></div>

<!-- The icon is the theme you would switch TO, which is why the dark
     deck shows a sun. Both glyphs ship; CSS shows one. -->
<button type="button" class="theme-toggle" id="themeBtn" aria-pressed="false"
        aria-label="Switch to light theme" title="Light / dark">
  <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.6v2.2M12 19.2v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
  </svg>
  <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9z"/>
  </svg>
</button>
<div class="hint">&larr; &rarr; NAVIGATE &nbsp;&middot;&nbsp; 0&ndash;7 JUMP TO SECTION</div>
<nav class="rail" id="rail"></nav>

<script>
(function () {
'use strict';

<!--#include js/*.js -->
})();
</script>
</body>
</html>
